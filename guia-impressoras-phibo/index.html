<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow"><meta name="description" content="Consulte impressoras compatíveis com Phibo, modelos de etiquetas e referências de compra.">
<title>Impressoras e Etiquetas | Guia Phibo</title>
<style>body{font:16px/1.55 system-ui,sans-serif;background:#f2f7fb;color:#163b55;margin:0;display:grid;min-height:100vh;place-items:center;text-align:center}main{padding:25px}h1{font-size:24px}.load{color:#687d8c}</style>
</head><body><main><h1>Guia Phibo de impressoras e etiquetas</h1><p class="load">Carregando os modelos e as opções de compra…</p></main>
<script>
(async function(){
try {
const response=await fetch("index-original.html",{cache:"no-store"});
if(!response.ok)throw Error("Falha ao carregar o catálogo: HTTP "+response.status);
let html=await response.text();
const end=html.toLowerCase().lastIndexOf("</body>");
if(end<0)throw Error("Catálogo original inválido.");
html=html.slice(0,end)+'<script src="phibo-enxuto.js" defer><'+'/script>'+html.slice(end);
document.open();document.write(html);document.close();
}catch(e){document.querySelector(".load").textContent="Não foi possível carregar o catálogo. Recarregue esta página.";console.error(e)}
})();
</script></body></html>
